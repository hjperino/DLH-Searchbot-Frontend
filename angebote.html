<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alle Angebote des Digital Learning Hub Sek II, filterbar nach Fach und Anliegen - daneben der DLH-Bot fuer alles, was die Liste nicht weiss.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='13' cy='16' r='9' fill='%23ec6608'/><circle cx='21' cy='16' r='8' fill='none' stroke='%238a5da4' stroke-width='2.5'/></svg>">
<title>Angebote und Bot</title>
<style>
  :root{
    --teal:#1d3437; --orange:#ec6608; --orange65:#f3965e; --orange30:#f9d1b4;
    --purple:#8a5da4; --purple65:#b396c4; --purple30:#dccee4;
    --bg:#ffffff; --panel:#f7f8f8; --line:#e2e6e6; --text:#1d3437;
    --muted:#5d7275; --card:#ffffff; --shadow:0 1px 2px rgba(29,52,55,.06);
    --fehler-bg:#fdeceb; --fehler-linie:#f3b8b1; --fehler-text:#8d2b20;
    /* Die Tönungen der Ursprungsseite: Fach violett, Anliegen orange,
       Eingrenzung blasser orange, Ergebnisse auf warmem Grund. Beides sind
       verdünnte DLH-Farben, keine erfundenen. */
    --box-fach:#f4f0f9;      --box-fach-linie:#ded3e9;
    --box-anliegen:#fdf4ec;  --box-anliegen-linie:#f2ddc6;
    --box-eng:#fefaf5;       --box-eng-linie:#f6e7d7;
    --grund-liste:#fbf8f5;
    --radius:10px; --col-l:600px; --col-r:360px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121a1b; --panel:#182223; --line:#2a3839; --text:#e8eded;
      --muted:#9fb0b2; --card:#1b2627; --shadow:none;
      --fehler-bg:#3a1d19; --fehler-linie:#7a3a30; --fehler-text:#f0b8ae;
      --box-fach:#1e1a25;     --box-fach-linie:#342c3e;
      --box-anliegen:#251d16; --box-anliegen-linie:#3e3227;
      --box-eng:#201c18;      --box-eng-linie:#362f26;
      --grund-liste:#151d1e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121a1b; --panel:#182223; --line:#2a3839; --text:#e8eded;
    --muted:#9fb0b2; --card:#1b2627; --shadow:none;
    --fehler-bg:#3a1d19; --fehler-linie:#7a3a30; --fehler-text:#f0b8ae;
    --box-fach:#1e1a25;     --box-fach-linie:#342c3e;
    --box-anliegen:#251d16; --box-anliegen-linie:#3e3227;
    --box-eng:#201c18;      --box-eng-linie:#362f26;
    --grund-liste:#151d1e;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms!important; transition-duration:.01ms!important;
      scroll-behavior:auto!important}
  }
  :where(button,input,select,a):focus-visible{
    outline:2px solid var(--orange); outline-offset:2px;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 "Helvetica Neue LT Std","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  a{color:var(--orange)}

  /* ---------- Gerüst: Kopfzeile + drei Spalten, volle Fensterhöhe ---------- */
  .app{
    display:grid;
    grid-template-rows:auto auto auto minmax(0,1fr);
    height:100dvh;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ---------- Markenleiste, wie auf der Ursprungsseite ---------- */
  .dlhbar{height:6px; background:linear-gradient(90deg,var(--purple) 0%,var(--orange) 100%)}
  .dlhtop{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 22px 12px; background:var(--bg);
  }
  .dlhtop img{height:42px; width:auto; display:block}
  /* Das Logo ist dunkelviolett auf Transparent und verschwindet auf dunklem
     Grund. Eine helle Platte darunter lässt die Marke unangetastet. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .dlhtop img{
      background:#fff; padding:5px 9px; border-radius:6px;
    }
  }
  :root[data-theme="dark"] .dlhtop img{background:#fff; padding:5px 9px; border-radius:6px}
  .dlhtop .ersatz{font-weight:700; font-size:15px; color:var(--purple)}
  .zurueck{
    font-size:12.8px; font-weight:700; color:var(--text); text-decoration:none;
    border-bottom:2px solid var(--orange); padding-bottom:1px; white-space:nowrap;
  }
  .zurueck:hover{color:var(--orange)}

  .kopf{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 22px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .kopf h1{font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em}
  .kopf .zahl{color:var(--orange); font-weight:700}
  .kopf .stand{color:var(--muted); font-size:12px; margin-left:auto}

  .spalten{
    display:grid; grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);
    min-height:0;
  }
  .spalte{min-height:0; min-width:0; overflow-y:auto; overscroll-behavior:contain}
  .links{border-right:1px solid var(--line); background:var(--panel); padding:14px}
  .mitte{padding:0}
  .rechts{border-left:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; overflow:hidden}

  /* ---------- Linke Spalte: die Türen ----------
     Die Fächer bekommen die volle Breite — als Wolke brauchen sie dann
     statt fünfzehn nur noch sieben Zeilen. Darunter die beiden hohen
     Listen nebeneinander: links die zwanzig Anliegen, rechts die
     Eingrenzung, die damit ohne Scrollen sichtbar bleibt.
     (Erster Versuch waren CSS-Spalten. Die verteilen automatisch, und
     automatisch hiess hier: Fächer füllen Bahn eins, Anliegen Bahn zwei,
     und Gefäss/Stufe/Aufwand rutschen unter die Falz.) */
  .tueren{display:grid; grid-template-columns:1fr 1fr; gap:16px 16px; align-items:start}
  .tueren > .spann{grid-column:1 / -1}
  .box{border-radius:var(--radius); padding:14px 16px 12px; border:1px solid var(--line)}
  .box-fach{background:var(--box-fach); border-color:var(--box-fach-linie)}
  .box-anliegen{background:var(--box-anliegen); border-color:var(--box-anliegen-linie)}
  .box-eng{background:var(--box-eng); border-color:var(--box-eng-linie)}
  .block{margin-bottom:14px}
  .block:last-child{margin-bottom:0}
  .box > .block:first-of-type{margin-top:0}
  h2.titel{
    font-size:11px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:0 0 10px; font-weight:600;
  }
  .block h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:0 0 8px; font-weight:600;
  }
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{
    border:1px solid var(--line); background:var(--card); border-radius:6px;
    padding:3px 10px; font-size:12.5px; cursor:pointer; line-height:1.45;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip:hover{border-color:var(--orange65)}
  .chip .n{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--orange); border-color:var(--orange); color:#fff}
  .chip[aria-pressed="true"] .n{color:#fff9}
  /* Jede Box quittiert in ihrer eigenen Farbe: violett beim Fach, orange
     beim Anliegen. Sonst leuchtet ein oranger Chip aus einem violetten
     Feld heraus, als gehörte er woandershin. */
  .box-fach .chip[aria-pressed="true"]{background:var(--purple); border-color:var(--purple)}
  .chip[data-leer="1"]{opacity:.38}
  .anliegen{display:flex; flex-direction:column; gap:4px}
  .anl{
    text-align:left; background:var(--card); cursor:pointer; border-radius:6px;
    padding:6px 9px; font-size:13px; display:flex; gap:8px; align-items:baseline;
    border:1px solid var(--line); border-left:3px solid transparent;
  }
  .anl:hover{border-color:var(--orange65); border-left-color:var(--orange65)}
  .anl[aria-pressed="true"]{background:var(--orange30); border-color:var(--orange30);
                            border-left-color:var(--orange);
                            color:var(--teal); font-weight:500}
  .anl .n{margin-left:auto; color:var(--muted); font-size:11.5px;
          font-variant-numeric:tabular-nums; flex:none}
  .anl[data-leer="1"]{opacity:.4}
  /* Erscheint nur, wenn wirklich gefiltert ist — dann aber deutlich.
     Gestrichelt und grau war es vorher, und damit sah es aus wie eine
     Randnotiz statt wie der Weg zurück. */
  .zuruecksetzen{
    width:100%; border:0; background:var(--orange); color:#fff; border-radius:8px;
    padding:10px 12px; font-size:14px; font-weight:600; cursor:pointer;
    margin-bottom:16px; display:flex; align-items:center; justify-content:center;
    gap:8px; box-shadow:0 1px 3px rgba(236,102,8,.35);
  }
  .zuruecksetzen:hover{background:#d75c07}
  .zuruecksetzen .x{
    font-size:16px; line-height:1; opacity:.85; font-weight:400;
  }

  /* ---------- Mittlere Spalte: Ergebnisse, sofort sichtbar ---------- */
  .suchzeile{
    position:sticky; top:0; z-index:5; background:var(--grund-liste);
    border-bottom:1px solid var(--line); padding:12px 18px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .suchzeile input{
    flex:1 1 220px; min-width:0; padding:8px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:inherit; font:inherit;
  }
  .suchzeile input:focus{outline:2px solid var(--orange65); outline-offset:-1px}
  .trefferzahl{font-size:13px; color:var(--muted); white-space:nowrap}
  .trefferzahl b{color:var(--orange); font-size:15px}
  .sortierung{
    padding:7px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:inherit; font-size:13px;
  }
  .mitte{background:var(--grund-liste)}
  .liste{padding:14px 18px 40px; display:grid; gap:10px}
  .karte{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .karte-kopf{display:flex; gap:10px; align-items:flex-start}
  .karte h3{margin:0; font-size:15px; font-weight:600; line-height:1.35; flex:1}
  .karte h3 a{color:inherit; text-decoration:none}
  .karte h3 a:hover{color:var(--orange); text-decoration:underline}
  .gef{
    flex:none; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap;
    background:var(--purple30); color:var(--teal);
  }
  .gef[data-g="Praxisbeispiel"]{background:var(--orange30)}
  .gef[data-g="Innovationsfonds"]{background:var(--purple30)}
  .gef[data-g="Essenz"]{background:#dfe9e6}
  .gef[data-g="Podcast"]{background:var(--orange65); color:#fff}
  .gef[data-g="eAssessment"]{background:var(--purple65); color:#fff}
  .karte p{margin:6px 0 8px; font-size:13.5px; color:var(--muted); line-height:1.5}
  .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11.5px}
  .tag{border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted)}
  .tag.fach{border-color:var(--orange30); color:var(--orange)}
  .tag.sofort{border-color:var(--purple65); color:var(--purple)}
  .karte-fuss{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .knopf{
    border:1px solid var(--line); background:none; border-radius:7px;
    padding:4px 11px; font-size:12.5px; cursor:pointer; color:var(--muted);
    text-decoration:none; display:inline-block;
  }
  .knopf:hover{border-color:var(--orange); color:var(--orange)}
  .knopf.primaer{border-color:var(--orange); color:var(--orange)}
  .leer{padding:50px 18px; text-align:center; color:var(--muted)}
  .mehr{margin:6px auto 0; display:block}

  /* ---------- Rechte Spalte: der Bot ---------- */
  .bot-kopf{padding:12px 14px; border-bottom:1px solid var(--line)}
  .bot-kopf h2{margin:0; font-size:13px; font-weight:600; display:flex;
               align-items:center; gap:7px}
  .punkt{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .punkt[data-status="ok"]{background:#2f9e5f}
  .punkt[data-status="weg"]{background:#c8402f}
  .bot-kopf p{margin:5px 0 0; font-size:11.5px; color:var(--muted); line-height:1.45}
  .botreset{
    margin-left:auto; border:1px solid var(--line); background:var(--card);
    border-radius:6px; padding:3px 9px; font-size:11.5px; font-weight:500;
    color:var(--muted); cursor:pointer;
  }
  .botreset:hover{border-color:var(--orange); color:var(--orange)}
  .kontext{
    margin:10px 14px 0; padding:9px 11px; border-radius:8px;
    background:var(--card); border:1px solid var(--line); font-size:12px;
  }
  .kontext b{color:var(--orange)}
  .verlauf{flex:1; min-height:0; overflow-y:auto; padding:12px 14px;
           display:flex; flex-direction:column; gap:10px}
  .blase{padding:9px 12px; border-radius:11px; font-size:13.5px; line-height:1.5; max-width:100%}
  .blase.ich{background:var(--orange); color:#fff; align-self:flex-end; border-bottom-right-radius:3px}
  .blase.bot{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:3px}
  .blase.bot :where(p,ul,ol){margin:.4em 0}
  .blase.bot ul,.blase.bot ol{padding-left:1.15em}
  .blase.bot h1,.blase.bot h2,.blase.bot h3{font-size:14px; margin:.5em 0 .3em}
  .blase.fehler{background:var(--fehler-bg); border:1px solid var(--fehler-linie);
                color:var(--fehler-text)}
  .blase.laedt{color:var(--muted); font-style:italic}
  .fundstellen{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
  /* Die Schnellfragen aus dem bestehenden Frontend. Gleiche Schrift, Grösse
     und Rundung wie die Fach-Chips — es ist dasselbe Bedienelement, nur mit
     einer anderen Aufgabe. Violett, damit man sie nicht für Filter hält. */
  .schnell{border-top:1px solid var(--line); padding:10px 14px 12px;
           max-height:34dvh; overflow-y:auto; background:var(--panel)}
  .schnell .chip{color:var(--purple); border-color:var(--purple30)}
  .schnell .chip:hover{border-color:var(--purple); background:var(--purple30)}
  .eingabe{border-top:1px solid var(--line); padding:10px 14px;
           padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px}
  .eingabe input{
    flex:1; min-width:0; padding:8px 11px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:inherit; font:inherit;
  }
  .eingabe input:focus{outline:2px solid var(--orange65); outline-offset:-1px}
  .eingabe button{
    border:0; background:var(--orange); color:#fff; border-radius:8px;
    padding:8px 15px; font-weight:600; cursor:pointer;
  }
  .eingabe button:disabled{opacity:.5; cursor:default}

  .umschalter{display:none}

  /* ---------- schmale Fenster ---------- */
  @media (max-width:1500px){ :root{--col-l:520px} }
  @media (max-width:1340px){
    :root{--col-l:300px; --col-r:320px}
    .tueren{grid-template-columns:1fr}
  }
  @media (max-width:980px){
    :root{--col-l:auto}
    .tueren{grid-template-columns:1fr 1fr}
  }
  @media (max-width:620px){ .tueren{grid-template-columns:1fr} }
  @media (max-width:560px){
    .dlhtop{padding:10px 16px 8px}
    .dlhtop img{height:34px}
    .kopf{padding:9px 16px}
    .kopf h1{font-size:15px}
    .kopf .stand{margin-left:0; width:100%}
  }
  @media (max-width:980px){
    /* minmax(0,…) statt 1fr: sonst setzt der breiteste Inhalt — eine lange
       Fachbezeichnung in einer Karte — die Untergrenze der Spalte, und die
       Seite scrollt seitlich. Bei 400 px war rechts alles abgeschnitten. */
    .spalten{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)}
    .links{
      border-right:0; border-bottom:1px solid var(--line); max-height:42dvh;
    }
    .links[hidden]{display:none}
    .rechts{
      position:fixed; inset:auto 0 0 0; height:72dvh; z-index:20;
      border-left:0; border-top:1px solid var(--line);
      border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(29,52,55,.18);
    }
    .rechts[hidden]{display:none}
    .umschalter{
      display:flex; gap:8px; position:fixed; right:14px;
      bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30;
    }
    .umschalter button{
      border:0; border-radius:999px; padding:10px 16px; font-weight:600;
      background:var(--orange); color:#fff; box-shadow:0 3px 12px rgba(29,52,55,.22);
      cursor:pointer;
    }
    .umschalter button.grau{background:var(--teal)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="dlhbar" aria-hidden="true"></div>

  <div class="dlhtop">
    <a href="https://dlh.zh.ch" target="_blank" rel="noopener"
       aria-label="Digital Learning Hub Sek II">
      <img id="dlhlogo" src="https://dlh.zh.ch/images/elements/DLH-Logo-Wappen-und-Loewe.svg"
           alt="Digital Learning Hub Sek II">
    </a>
    <a class="zurueck" href="https://dlh.zh.ch" target="_blank" rel="noopener">dlh.zh.ch</a>
  </div>

  <header class="kopf">
    <h1>Was brauche ich für meinen Unterricht?</h1>
    <span class="trefferzahl" style="display:none"></span>
    <span class="stand" id="stand"></span>
  </header>

  <div class="spalten">

    <!-- ===== links: die Türen ===== -->
    <aside class="spalte links" id="links">
      <button class="zuruecksetzen" id="reset" type="button" hidden>
        <span class="x" aria-hidden="true">✕</span> Alle Filter zurücksetzen
      </button>

      <div class="tueren">
        <section class="box box-fach spann">
          <h2 class="titel">Mein Fach</h2>
          <div class="chips" id="faecher"></div>
        </section>

        <section class="box box-anliegen">
          <h2 class="titel">Ich möchte …</h2>
          <div class="anliegen" id="anliegen"></div>
        </section>

        <section class="box box-eng">
          <h2 class="titel">Weiter eingrenzen</h2>
          <div class="block">
            <h2>Gefäss</h2>
            <div class="chips" id="gefaesse"></div>
          </div>

          <div class="block">
            <h2>Stufe</h2>
            <div class="chips" id="stufen"></div>
          </div>

          <div class="block">
            <h2>Aufwand</h2>
            <div class="chips" id="aufwaende"></div>
          </div>

          <div class="block">
            <div class="chips">
              <button class="chip" id="archiv" aria-pressed="false">Archiv mitzeigen</button>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <!-- ===== Mitte: Ergebnisse ===== -->
    <main class="spalte mitte">
      <div class="suchzeile">
        <input id="suche" type="search" placeholder="Suchen: Fiete, Escape, Chemie …"
               autocomplete="off" aria-label="Volltextsuche">
        <span class="trefferzahl" id="treffer"></span>
        <select class="sortierung" id="sortierung" aria-label="Sortierung">
          <option value="gefaess">nach Gefäss</option>
          <option value="titel">nach Titel</option>
          <option value="datum">nach Datum</option>
          <option value="aufwand">nach Aufwand</option>
        </select>
      </div>
      <div class="liste" id="liste"></div>
    </main>

    <!-- ===== rechts: der Bot ===== -->
    <aside class="rechts" id="rechts">
      <div class="bot-kopf">
        <h2><span class="punkt" id="punkt" data-status="?"></span> DLH-Bot
            <span id="botlage" style="font-weight:400;color:var(--muted);font-size:11.5px"></span>
            <button class="botreset" id="botreset" type="button"
                    title="Gespräch löschen und neu beginnen">✕ Zurücksetzen</button></h2>
        <p id="botstatus">Fragen Sie, was die Liste nicht beantwortet: was etwas
          bedeutet, wer dahintersteckt, wann das Nächste läuft.</p>
      </div>
      <div class="kontext" id="kontext" hidden></div>
      <div class="verlauf" id="verlauf"></div>
      <div class="schnell">
        <h2 class="titel">Weitere schnelle Informationen zum DLH</h2>
        <div class="chips" id="schnellfragen"></div>
      </div>
      <form class="eingabe" id="form">
        <input id="frage" placeholder="Frage an den Bot …" autocomplete="off" aria-label="Frage">
        <button type="submit" id="senden">Fragen</button>
      </form>
    </aside>
  </div>
</div>

<div class="umschalter">
  <button class="grau" id="btnFilter" type="button">Filter</button>
  <button id="btnBot" type="button">Bot</button>
</div>

<script>
/* ==========================================================================
   Angebotsliste + DLH-Bot in einem Fenster.

   Zwei Werkzeuge, die verschiedene Fragen beantworten:
   die Liste zeigt, WAS es gibt (Stand einer Ernte, filterbar),
   der Bot erklaert, WAS etwas IST und WANN das Naechste laeuft (live).

    });
  };
  mengeChips("#gefaesse", GEFAESSE, Z.gefaesse, "gefaess", "gefaess");
  mengeChips("#stufen", STUFEN, Z.stufen, "stufen", "stufe");
  mengeChips("#aufwaende", AUFWAENDE, Z.aufwaende, "aufwand", "aufwand");

  $("#archiv").setAttribute("aria-pressed", Z.archiv ? "true":"false");
  $("#reset").hidden = !aktiv();
}

/* ---------- Ergebnisse ------------------------------------------------------ */
let gezeigt = 60;

function karte(a){
  const d = document.createElement("article");
  d.className = "karte"; d.id = "angebot-"+a._i;
  const faecher = (a.faecher||[]).filter(x => x!=="Überfachlich");
  const meta = [];
  faecher.slice(0,4).forEach(x => meta.push('<span class="tag fach">'+esc(x)+'</span>'));
  if (faecher.length > 4) meta.push('<span class="tag">+'+(faecher.length-4)+'</span>');
  if (!faecher.length) meta.push('<span class="tag">überfachlich</span>');
  if (a.aufwand) meta.push('<span class="tag'+(a.aufwand==="sofort einsetzbar"?" sofort":"")+'">'+esc(a.aufwand)+'</span>');
  if (a.datum) meta.push('<span class="tag">'+esc(a.datum)+'</span>');
  if (a.archiv) meta.push('<span class="tag">Archiv</span>');

  d.innerHTML =
    '<div class="karte-kopf">'+
      '<h3><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.titel)+'</a></h3>'+
      '<span class="gef" data-g="'+esc(a.gefaess)+'">'+esc(a.gefaess)+'</span>'+
    '</div>'+
    '<p>'+esc(a.lead)+'</p>'+
    '<div class="meta">'+meta.join("")+'</div>'+
    '<div class="karte-fuss">'+
      '<a class="knopf primaer" href="'+esc(a.url)+'" target="_blank" rel="noopener">Öffnen</a>'+
      '<button class="knopf" type="button" data-frage="'+esc(a.titel)+'">Bot dazu fragen</button>'+
    '</div>';
  d.querySelector("[data-frage]").addEventListener("click", () => {
    frageStellen('Was steckt hinter «'+a.titel+'»?');
  });
  return d;
}

function zeichneListe(){
  const t = treffer();
  const sortiert = t.slice().sort((x,y) => {
    if (Z.sortierung==="titel")  return x.titel.localeCompare(y.titel,"de");
    if (Z.sortierung==="datum")  return (y._sort||"").localeCompare(x._sort||"");
    if (Z.sortierung==="aufwand")return AUFWAENDE.indexOf(x.aufwand)-AUFWAENDE.indexOf(y.aufwand);
    return GEFAESSE.indexOf(x.gefaess)-GEFAESSE.indexOf(y.gefaess)
        || x.titel.localeCompare(y.titel,"de");
  });

  $("#treffer").innerHTML = t.length
    ? '<b>'+t.length+'</b> von '+ANG.filter(a=>Z.archiv||!a.archiv).length
    : '';
  const liste = $("#liste"); liste.textContent = "";
  if (!sortiert.length){
    liste.innerHTML = '<div class="leer">Nichts gefunden. Weniger Filter – oder '+
      'fragen Sie rechts den Bot, er sucht anders.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  sortiert.slice(0, gezeigt).forEach(a => frag.appendChild(karte(a)));
  liste.appendChild(frag);
  if (sortiert.length > gezeigt){
    const b = document.createElement("button");
    b.className = "knopf mehr"; b.type = "button";
    b.textContent = "Weitere "+Math.min(60, sortiert.length-gezeigt)+" anzeigen";
    b.addEventListener("click", () => { gezeigt += 60; zeichneListe(); });
    liste.appendChild(b);
  }
}

/* ---------- Die Brücke: Filter -> Kontext für den Bot ----------------------- */
function baueKontext(){
  const k = $("#kontext");
  if (!aktiv()){ k.hidden = true; return; }
  const teile = [];
  if (Z.fach) teile.push(Z.fach);
  if (Z.anliegen !== null) teile.push(ANL[Z.anliegen].replace(/^…\s*/,""));
  Z.gefaesse.forEach(g => teile.push(g));
  if (Z.suche) teile.push('„'+Z.suche+'“');

  /* Keine Fragevorschläge mehr.
     Aus dem Filter abgeleitete Fragen klangen plausibel und waren es nicht:
     «Sport» hat ein einziges Angebot, der Vorschlag lautete «Welche
     Weiterbildung gibt es für Sport?», und der Bot antwortete mit dem
     allgemeinen Weiterbildungsangebot — korrekt, aber am Fach vorbei. Ein
     Vorschlag, der ins Leere führt, ist schlechter als keiner: er verspricht
     dem Lesenden, die Frage sei die richtige. Was bleibt, ist der Hinweis,
     wofür der Bot zuständig ist. Die gezielte Frage steht weiterhin auf
     jeder Karte («Bot dazu fragen») — die nennt einen konkreten Titel und
     trifft deshalb. */
  k.hidden = false;
  k.innerHTML = '<div>Ihr Filter: <b>'+esc(teile.join(" · "))+'</b><br>'+
    '<span style="color:var(--muted)">Die Liste zeigt den Stand vom '+
    esc(DB.stand_der_uebersicht||"")+'. Fragen Sie mich nach Hintergrund, '+
    'Personen oder kommenden Terminen — das steht hier nicht.</span></div>';
}

/* ---------- Die Brücke zurück: Bot-Antwort -> Sprung in die Liste ----------- */
const nachUrl = new Map();
ANG.forEach(a => { if(!nachUrl.has(a.url)) nachUrl.set(a.url, a._i); });

function zeigeEinzeln(i){
  Z.nurEins = i; gezeigt = 60; zeichneListe(); baueFilter();
  const el = document.getElementById("angebot-"+i);
  el?.scrollIntoView?.({behavior:"smooth", block:"center"});
  if (window.innerWidth <= 980) umschalten("liste");
}

function fundstellenAus(el){
  const gefunden = new Map();
  el.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute("href");
    if (nachUrl.has(href)) gefunden.set(href, nachUrl.get(href));
    a.target = "_blank"; a.rel = "noopener";
  });
  if (!gefunden.size) return null;
  const box = document.createElement("div");
  box.className = "fundstellen";
  gefunden.forEach((i,href) => {
    const b = document.createElement("button");
    b.className = "knopf"; b.type = "button";
    b.textContent = "↧ "+ANG[i].titel.slice(0,34)+(ANG[i].titel.length>34?"…":"");
    b.title = "In der Liste zeigen";
    b.addEventListener("click", () => zeigeEinzeln(i));
    box.appendChild(b);
  });
  return box;
}

/* ---------- Der Bot --------------------------------------------------------- */
let zustand = null;
let sitzung = "proto-" + Math.random().toString(36).slice(2,10);

const BEGRUESSUNG =
  "Die Liste links zeigt, welche Angebote es gibt. Ich kann hier hinzufügen, "+
  "wer oder was hinter einem Angebot steckt und was allenfalls als Nächstes "+
  "beim DLH geplant ist. Fragen Sie einfach — oder klicken Sie auf einer "+
  "Karte «Bot dazu fragen».";

/* Zurücksetzen heisst: Verlauf weg UND Gesprächszustand weg. Nur die Blasen
   zu löschen würde täuschen — der Bot trüge den alten conversation_state
   weiter und bezöge sich auf ein Gespräch, das nicht mehr zu sehen ist. */
function botZuruecksetzen(){
  zustand = null;
  sitzung = "proto-" + Math.random().toString(36).slice(2,10);
  $("#verlauf").textContent = "";
  blase(BEGRUESSUNG, "bot");
  $("#frage").value = "";
  $("#frage").focus();
}

function blase(text, art, alsHtml){
  const d = document.createElement("div");
  d.className = "blase " + art;
  if (alsHtml) d.innerHTML = text; else d.textContent = text;
  $("#verlauf").appendChild(d);
  $("#verlauf").scrollTop = $("#verlauf").scrollHeight;
  return d;
}

async function frageStellen(text){
  const f = (text || $("#frage").value || "").trim();
  if (!f) return;
  $("#frage").value = "";
  $("#senden").disabled = true;
  if (window.innerWidth <= 980) umschalten("bot");
  blase(f, "ich");
  const laedt = blase("Der Bot sucht …", "bot laedt");

  try {
    const r = await fetch(API + "/ask", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:f, conversation_state:zustand, session_id:sitzung})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (d.metadata) zustand = d.metadata;
    laedt.remove();
    const b = blase(d.answer || "Dazu habe ich nichts gefunden.", "bot", true);
    const fs = fundstellenAus(b);
    if (fs) b.appendChild(fs);
    $("#verlauf").scrollTop = $("#verlauf").scrollHeight;
  } catch (e) {
    laedt.remove();
    blase("Der Bot ist nicht erreichbar (" + e.message + "). Auf GitHub Pages " +
          "und perino.info funktioniert er; von einer anderen Adresse blockiert " +
          "ihn der Browser (CORS). Die Liste links arbeitet unabhängig weiter.",
          "bot fehler");
  } finally {
    $("#senden").disabled = false;
    $("#frage").focus();
  }
}

async function botStatus(){
  let erreichbar = false;
  try { erreichbar = (await fetch(API + "/health")).ok; } catch { erreichbar = false; }
  $("#punkt").dataset.status = erreichbar ? "ok" : "weg";
  $("#botlage").textContent = erreichbar ? "live" : "nicht erreichbar";
  if (!erreichbar){
    $("#botstatus").textContent =
      "Von dieser Adresse aus blockiert der Browser den Bot (CORS). Er "+
      "antwortet auf hjperino.github.io, auf perino.info und unter localhost. "+
      "Die Liste links arbeitet unabhängig davon.";
  }
}

/* ---------- schmale Fenster: umschalten ------------------------------------ */
function umschalten(was){
  const schmal = window.innerWidth <= 980;
  if (!schmal){ $("#links").hidden = false; $("#rechts").hidden = false; return; }
  $("#rechts").hidden = (was !== "bot");
  $("#links").hidden  = (was !== "filter");
}

/* ---------- alles neu ------------------------------------------------------- */
function alles(){ gezeigt = 60; baueFilter(); zeichneListe(); baueKontext(); }

/* ---------- Verdrahtung ----------------------------------------------------- */
$("#stand").textContent = "Liste: Stand " + (DB.stand_der_uebersicht||"–");
$("#suche").addEventListener("input", e => { Z.suche = e.target.value; Z.nurEins=null; alles(); });
$("#sortierung").addEventListener("change", e => { Z.sortierung = e.target.value; zeichneListe(); });
$("#archiv").addEventListener("click", () => { Z.archiv = !Z.archiv; Z.nurEins=null; alles(); });
$("#reset").addEventListener("click", () => {
  Z.fach=null; Z.anliegen=null; Z.gefaesse.clear(); Z.stufen.clear();
  Z.aufwaende.clear(); Z.suche=""; Z.nurEins=null; $("#suche").value=""; alles();
});
$("#form").addEventListener("submit", e => { e.preventDefault(); frageStellen(); });
$("#btnFilter").addEventListener("click", () =>
  umschalten($("#links").hidden ? "filter" : "liste"));
$("#btnBot").addEventListener("click", () =>
  umschalten($("#rechts").hidden ? "bot" : "liste"));
window.addEventListener("resize", () => {
  if (window.innerWidth > 980){ $("#links").hidden=false; $("#rechts").hidden=false; }
});

$("#botreset").addEventListener("click", botZuruecksetzen);

SCHNELL.forEach(([beschriftung, frage]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.textContent = beschriftung; b.title = frage;
  b.addEventListener("click", () => frageStellen(frage));
  $("#schnellfragen").appendChild(b);
});

/* Das Logo liegt auf dlh.zh.ch, wie bei André. Auf GitHub Pages lädt es;
   in einer Umgebung mit strenger Inhaltsrichtlinie (etwa der Artefakt-
   Vorschau) wird es blockiert. Dann steht der Name da statt eines
   kaputten Bildsymbols. */
$("#dlhlogo").addEventListener("error", function(){
  const ersatz = document.createElement("span");
  ersatz.className = "ersatz";
  ersatz.textContent = "Digital Learning Hub Sek II";
  this.replaceWith(ersatz);
});

alles();
umschalten("liste");
botStatus();
blase(BEGRUESSUNG, "bot");
</script>
</body>
</html>
